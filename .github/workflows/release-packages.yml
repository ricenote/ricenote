name: release-packages

on:
  push:
    tags: ['packages-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只校验不发布
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 不写 version：pnpm 版本由根 package.json 的 packageManager 字段决定。
      # 两处都声明会直接报 "Multiple versions of pnpm specified"（本次踩到过）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org   # 会写 .npmrc，凭据取自 NODE_AUTH_TOKEN

      - run: pnpm install --frozen-lockfile

      # 顺序不能颠倒：validate 会加载工作区包的构建产物（apps/server 的校验命令 import
      # `@ricenote/core/dist`），先跑会因为"找不到 dist/index.js"直接失败。
      # 版本号一致性另外由 build 里的 version:check 先挡一道。
      - run: pnpm build                              # 发布前必须构建，脚本会校验 dist 存在
      - run: pnpm validate                           # 清单校验（版本号 + 插件/主题，不需要数据库）

      # --skip-published 常开：npm 不允许覆盖已发布的版本号，
      # 而全量发布会一次尝试 17 个包 —— 只要有一个版本没变就会中断整轮。
      # 开启后"只改了插件 X"也能直接跑全量，没变的版本会被跳过并列出。
      - name: 发布（顺序由脚本保证：shared → SDK → 插件）
        run: node scripts/release-plugins.mjs --skip-published ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
