name: ricenote

services:
  mysql:
    image: mysql:8.4
    container_name: ricenote-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-ricenote}
      MYSQL_USER: ${DB_USER:-ricenote}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ricenote}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_ROOT_PASSWORD:-password}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [ricenote]

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: ricenote-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-ricenote}
      DB_PASSWORD: ${DB_PASSWORD:-ricenote}
      DB_NAME: ${DB_NAME:-ricenote}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
    volumes:
      - ./storage:/app/storage
      - ./plugins:/app/plugins
      - ./themes:/app/themes
    networks: [ricenote]

  nginx:
    image: nginx:1.27-alpine
    container_name: ricenote-nginx
    restart: unless-stopped
    depends_on: [server]
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ricenote]
    profiles: [with-nginx]

volumes:
  mysql-data:

networks:
  ricenote:
    driver: bridge
